<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freezer Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">❄ Freezer Tracker</div>
      <nav class="tabs">
        <button data-tab="boxes" class="active">Boxes</button>
        <button data-tab="whos">Who's where</button>
        <button data-tab="history">History</button>
      </nav>
      <form id="search-form" class="search">
        <input id="search" type="search" placeholder="Search samples, types, owners, notes or S-000123" autocomplete="off">
      </form>
      <button id="whoami" class="whoami" title="Change who you are"></button>
    </header>

    <div class="body">
      <aside id="sidebar"></aside>
      <main id="main"></main>
    </div>
  </div>

  <div id="banner" hidden></div>
  <div id="toast" hidden></div>
  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <dialog id="confirm"></dialog>
  <div id="print-area"></div>

  <script src="app.js"></script>
</body>
</html>
